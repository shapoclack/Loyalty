server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${LOYALTY_DB_URL:jdbc:postgresql://localhost:55433/loyalty_web}
    username: ${POSTGRES_USER:loyalty}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt-secret: ${JWT_SECRET_BASE64}
  issuer: ${JWT_ISSUER:loyalty}
  access-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-days: ${REFRESH_TOKEN_DAYS:14}
  origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-login: ${BOOTSTRAP_ADMIN_EMAIL:admin@loyalty.local}
  admin-name: ${BOOTSTRAP_ADMIN_NAME:Loyalty Administrator}
  admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
