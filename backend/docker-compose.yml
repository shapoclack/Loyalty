name: loyalty-web
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${WEB_POSTGRES_DB:-loyalty_web}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Set DOCKER_POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${WEB_POSTGRES_PORT:-55433}:5432"
    volumes:
      - loyalty_web_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      APP_PORT: 8080
      LOYALTY_DB_URL: jdbc:postgresql://postgres:5432/${WEB_POSTGRES_DB:-loyalty_web}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Set DOCKER_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
volumes:
  loyalty_web_data:
